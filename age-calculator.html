,<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator - SmartToolsHub360</title>

<link rel="stylesheet" href="style.css">

<style>
.age-box{
max-width:700px;
margin:40px auto;
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 8px 20px rgba(0,0,0,.10);
text-align:center;
}

.age-box h1{
font-size:32px;
margin-bottom:10px;
color:#0d6efd;
}

.age-box p{
color:#666;
margin-bottom:25px;
}

.input-box{
margin:20px 0;
}

.input-box input{
width:100%;
padding:15px;
font-size:18px;
border:2px solid #0d6efd;
border-radius:12px;
box-sizing:border-box;
}

.btn{
margin-top:20px;
width:100%;
padding:15px;
font-size:20px;
font-weight:bold;
background:#0d6efd;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
}

.btn:hover{
background:#0b5ed7;
}

.result{
margin-top:30px;
font-size:22px;
font-weight:bold;
color:#222;
}
</style>

</head>

<body>

<header>
SmartToolsHub360
</header>

<div class="container">

<div class="age-box">

<h1>🎂 Age Calculator</h1>

<p>Enter your Date of Birth to calculate your exact age.</p>

<div class="input-box">

<select id="day">
<option value="">Day</option>
</select>

<select id="month">
<option value="">Month</option>
<option value="1">January</option>
<option value="2">February</option>
<option value="3">March</option>
<option value="4">April</option>
<option value="5">May</option>
<option value="6">June</option>
<option value="7">July</option>
<option value="8">August</option>
<option value="9">September</option>
<option value="10">October</option>
<option value="11">November</option>
<option value="12">December</option>
</select>

<select id="year">
<option value="">Year</option>
</select>

</div>

<button class="btn">
Calculate Age
</button>

<div class="result">
Your age will appear here.
</div>

</div>

</div>

  <script>
document.addEventListener("DOMContentLoaded", function () {

  const day = document.getElementById("day");
  const month = document.getElementById("month");
  const year = document.getElementById("year");
  const button = document.querySelector(".btn");
  const result = document.querySelector(".result");

  // Day dropdown fill
  for (let i = 1; i <= 31; i++) {
    let option = document.createElement("option");
    option.value = i;
    option.text = i;
    day.appendChild(option);
  }

  // Year dropdown fill
  const currentYear = new Date().getFullYear();
  for (let i = currentYear; i >= 1900; i--) {
    let option = document.createElement("option");
    option.value = i;
    option.text = i;
    year.appendChild(option);
  }

  button.addEventListener("click", function () {

    if (day.value === "" || month.value === "" || year.value === "") {
      result.innerHTML = "⚠️ Please select Day, Month and Year.";
      return;
    }

    const birthDate = new Date(year.value, month.value - 1, day.value);
    const today = new Date();

    let years = today.getFullYear() - birthDate.getFullYear();
    let months = today.getMonth() - birthDate.getMonth();
    let days = today.getDate() - birthDate.getDate();

    if (days < 0) {
      months--;
      const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
      days += lastMonth.getDate();
    }

    if (months < 0) {
      years--;
      months += 12;
    }

    result.innerHTML =
      `🎉 Your Age is <br><br>
      <b>${years}</b> Years,
      <b>${months}</b> Months,
      <b>${days}</b> Days`;
  });

});
  </script>
  
</body>
</html>
